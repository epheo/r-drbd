name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Run only the lanes the change since this ref needs; empty runs every lane
        default: ""
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  # Backtraces keep their lines; the test archive shrinks several fold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      vm: ${{ steps.diff.outputs.vm }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Without a base, as on main, every lane runs: the public tree test
      # then still sees a docs-only change once it merges.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          if [ -z "$BASE" ]; then
            printf 'code=true\nvm=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git rev-parse --verify -q "origin/$BASE" || git rev-parse --verify "$BASE")
          files=$(git diff --name-only "$(git merge-base "$base" HEAD)" HEAD)
          printf '%s\n' "$files"
          code=false
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then code=true; fi
          # What the VM lanes test: the agent and controller, their image,
          # their manifests and the lanes themselves.
          vm=false
          if printf '%s\n' "$files" | grep -qE '^(crates/|deploy/|tools/ci/|Cargo\.|Containerfile$|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'; then vm=true; fi
          printf 'code=%s\nvm=%s\n' "$code" "$vm" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and components rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo nextest archive --workspace --locked --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 3
      - name: unit tests
        run: cargo nextest run --workspace --locked --profile ci-unit

  envtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # The tests read the tree at the path they were built from.
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # envtest runs a real etcd and kube-apiserver for the controller tests;
      # the require flag turns a broken install into failures, not skips.
      - id: tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools
          key: ${{ runner.os }}-envtest-1.33.0-csi-test-v5.6.0
      - if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - if: steps.tools.outputs.cache-hit != 'true'
        env:
          TOOLS: ${{ runner.temp }}/tools
        run: |
          mkdir -p "$TOOLS"
          curl -sSfL -o "$RUNNER_TEMP/envtest.tar.gz" \
            https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.33.0/envtest-v1.33.0-linux-amd64.tar.gz
          echo "2cb7f5468ed7cea1492f971b715bcc27069e824cf7d5927b7f127f1e8c75cf086eea050543cdb5f79faee0a2bf775f160adf27443aa7ee845d962d04e9d43ac9  $RUNNER_TEMP/envtest.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/envtest.tar.gz" -C "$TOOLS" --strip-components=2
          GOBIN="$TOOLS" go install github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.6.0
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - run: >-
          cargo-nextest nextest run --archive-file nextest.tar.zst
          --workspace-remap . --profile ci-envtest
          --partition count:${{ matrix.shard }}/3
        env:
          KUBEBUILDER_ASSETS: ${{ runner.temp }}/tools
          R_DRBD_REQUIRE_ENVTEST: "1"
          CSI_SANITY: ${{ runner.temp }}/tools/csi-sanity

  # Apart from build, so the envtest shards need not wait for it. The VM
  # lanes take the PR image and the host tests as a static binary.
  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: host test binary
        env:
          # ring compiles C; clang targets musl without musl-tools.
          CC_x86_64_unknown_linux_musl: clang
        run: |
          bin=$(cargo test -p agent --test host --no-run --locked \
              --target x86_64-unknown-linux-musl --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "host" and .profile.test) | .executable')
          install -D "$bin" "$RUNNER_TEMP/host-test/host-test"
      - uses: actions/upload-artifact@v7
        with:
          name: host-test
          path: ${{ runner.temp }}/host-test/host-test
          retention-days: 3
      - uses: docker/setup-buildx-action@v4
      # Same caches as image.yml, which says why.
      - id: cargo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-cache
          key: image-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: image-cargo-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/cargo-cache/registry": "/usr/local/cargo/registry",
              "${{ runner.temp }}/cargo-cache/target": "/src/target"
            }
          skip-extraction: ${{ steps.cargo.outputs.cache-hit }}
          scratch-dir: ${{ runner.temp }}/dance
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          tags: localhost/r-drbd:ci
          outputs: type=oci,dest=${{ runner.temp }}/r-drbd.tar
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - uses: actions/upload-artifact@v7
        with:
          name: r-drbd-image
          path: ${{ runner.temp }}/r-drbd.tar
          retention-days: 3

  # The disk the VM lanes boot, built once per MicroShift image and disk
  # recipe; PRs read the one main built.
  vm-disk:
    needs: changes
    if: needs.changes.outputs.vm == 'true'
    # bootc-image-builder fails its mounts on ubuntu-26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - id: key
        run: |
          digest=$(sed -n 's/^FROM [^ ]*microshift[^ ]*@sha256:\([0-9a-f]*\).*/\1/p' tools/ci/microshift.Containerfile)
          echo "key=vm-disk-${digest:0:12}-${{ hashFiles('tools/ci/microshift.Containerfile', 'tools/ci/disk.sh') }}" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vm-disk
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          WORK: ${{ runner.temp }}/vm-disk-work
        run: tools/ci/disk.sh "$RUNNER_TEMP/vm-disk"
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vm-disk
          key: ${{ steps.key.outputs.key }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: vm-disk-logs
          path: ${{ runner.temp }}/vm-disk-work/proof/logs
          if-no-files-found: ignore

  ci-ok:
    if: always()
    needs: [changes, lint, build, envtest, image, vm-disk]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lanes: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
