name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
env:
  # Backtraces keep their lines; the test archive shrinks several fold.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and components rust-toolchain.toml names.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      - run: cargo nextest archive --workspace --locked --archive-file nextest.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest.tar.zst
          retention-days: 3
      - name: unit tests
        run: cargo nextest run --workspace --locked --profile ci-unit

  envtest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # The tests read the tree at the path they were built from.
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # envtest runs a real etcd and kube-apiserver for the controller tests;
      # the require flag turns a broken install into failures, not skips.
      - id: tools
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tools
          key: ${{ runner.os }}-envtest-1.33.0-csi-test-v5.6.0
      - if: steps.tools.outputs.cache-hit != 'true'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - if: steps.tools.outputs.cache-hit != 'true'
        env:
          TOOLS: ${{ runner.temp }}/tools
        run: |
          mkdir -p "$TOOLS"
          curl -sSfL -o "$RUNNER_TEMP/envtest.tar.gz" \
            https://github.com/kubernetes-sigs/controller-tools/releases/download/envtest-v1.33.0/envtest-v1.33.0-linux-amd64.tar.gz
          echo "2cb7f5468ed7cea1492f971b715bcc27069e824cf7d5927b7f127f1e8c75cf086eea050543cdb5f79faee0a2bf775f160adf27443aa7ee845d962d04e9d43ac9  $RUNNER_TEMP/envtest.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/envtest.tar.gz" -C "$TOOLS" --strip-components=2
          GOBIN="$TOOLS" go install github.com/kubernetes-csi/csi-test/v5/cmd/csi-sanity@v5.6.0
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
      - run: >-
          cargo-nextest nextest run --archive-file nextest.tar.zst
          --workspace-remap . --profile ci-envtest
          --partition count:${{ matrix.shard }}/3
        env:
          KUBEBUILDER_ASSETS: ${{ runner.temp }}/tools
          R_DRBD_REQUIRE_ENVTEST: "1"
          CSI_SANITY: ${{ runner.temp }}/tools/csi-sanity

  ci-ok:
    if: always()
    needs: [lint, build, envtest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lanes: $RESULTS"
          for r in $RESULTS; do
            case $r in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
