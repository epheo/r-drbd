name: image
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # The Containerfile's cargo cache mounts live in the builder, which
      # dies with the runner: the dance moves them through actions/cache.
      # ci.yml builds the PR image with the same caches.
      - id: cargo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cargo-cache
          key: image-cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: image-cargo-
      - uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/cargo-cache/registry": "/usr/local/cargo/registry",
              "${{ runner.temp }}/cargo-cache/target": "/src/target"
            }
          skip-extraction: ${{ steps.cargo.outputs.cache-hit }}
          # Out of the build context.
          scratch-dir: ${{ runner.temp }}/dance
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/r-drbd
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
