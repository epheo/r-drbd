version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # A hijacked release is usually yanked within days; skip the fresh ones.
    cooldown:
      default-days: 7
    ignore:
      # ahash, under kube-runtime, pins getrandom 0.3; a newer one is a duplicate.
      - dependency-name: getrandom
        update-types: ["version-update:semver-major"]
    groups:
      # kube pins k8s-openapi and base64, so none of them can move alone.
      kube:
        patterns: [kube, k8s-openapi, base64]
      # One PR, so cargo-deny's duplicate-version check sees the whole bump.
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/, /deploy/openshift/kmm]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # rust-toolchain.toml is the one toolchain pin; bump both together by hand.
      - dependency-name: "*rust"
    groups:
      images:
        patterns: ["*"]
