# nextest runs each test in its own process, where the apiserver cap in
# crates/controller/tests/support never binds; this group is the cap there.
[test-groups]
envtest = { max-threads = 4 }

[[profile.default.overrides]]
filter = "package(controller) & kind(test)"
test-group = "envtest"

[profile.ci]
fail-fast = false
failure-output = "immediate-final"

[profile.ci-unit]
inherits = "ci"
default-filter = "not (package(controller) & kind(test))"

[profile.ci-envtest]
inherits = "ci"
default-filter = "package(controller) & kind(test)"
