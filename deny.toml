[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "deny"

# Build only: psm's build script writes its archive with it.
[[licenses.exceptions]]
crate = "ar_archive_writer"
allow = ["Apache-2.0 WITH LLVM-exception"]

[bans]
# Upstream crates split versions we cannot unify; listed, never blocking.
multiple-versions = "warn"
deny = [
  { name = "openssl-sys", reason = "rustls with ring only" },
  { name = "aws-lc-sys", reason = "ring is the only crypto backend" },
]

[advisories]
yanked = "deny"
