[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.9
unused-allowed-license = "deny"

[bans]
multiple-versions = "deny"
# Upstream duplicates no manifest here can unify; a new one fails the check.
skip = [
  { crate = "foldhash:<0.2", reason = "hashbrown 0.15 via petgraph, build only" },
  { crate = "getrandom:<0.3", reason = "ring" },
  { crate = "hashbrown:<0.17", reason = "petgraph (build) and kube-runtime" },
  { crate = "syn:<3", reason = "proc macros not yet on syn 3" },
  { crate = "unicode-width:<0.2", reason = "miette via protox, build only" },
]
deny = [
  { name = "openssl-sys", reason = "rustls with ring only" },
  { name = "aws-lc-sys", reason = "ring is the only crypto backend" },
]

[advisories]
yanked = "deny"
