apiVersion: apps/v1
kind: Deployment
metadata:
  name: r-drbd-controller
  namespace: r-drbd-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: r-drbd-controller}
  template:
    metadata:
      labels: {app: r-drbd-controller}
    spec:
      serviceAccountName: r-drbd-controller
      priorityClassName: system-cluster-critical
      # Preferred, not required: k3s and RKE2 label control-plane nodes "true", managed clusters have none.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - {key: node-role.kubernetes.io/control-plane, operator: Exists}
            - weight: 100
              preference:
                matchExpressions:
                  - {key: node-role.kubernetes.io/master, operator: Exists}
      # No blanket toleration: the pod must be evicted from a dead node so a replacement takes the Lease.
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
        - {key: node-role.kubernetes.io/master, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30}
      containers:
        - name: controller
          image: ghcr.io/epheo/r-drbd:sha-5b9d775
          imagePullPolicy: IfNotPresent
          args: ["controller"]
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: RUST_LOG
              value: info
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=true
            - --extra-create-metadata
            - --default-fstype=xfs
            - --leader-election=false
            - --timeout=60s
            - --enable-capacity
            # The owner is the Deployment: pod, then ReplicaSet, then Deployment.
            - --capacity-ownerref-level=2
            - --capacity-poll-interval=60s
            - --v=2
          env:
            - name: NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0
          args: ["--csi-address=/csi/csi.sock", "--leader-election=false", "--timeout=60s", "--v=2"]
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.2.1
          args: ["--csi-address=/csi/csi.sock", "--leader-election=false", "--timeout=60s", "--v=2"]
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
          args: ["--csi-address=/csi/csi.sock", "--leader-election=false", "--timeout=60s", "--v=2"]
          volumeMounts:
            - {name: socket-dir, mountPath: /csi}
      volumes:
        - name: socket-dir
          emptyDir: {}
