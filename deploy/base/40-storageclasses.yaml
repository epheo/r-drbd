# Defaults; copy and rename to match your tiers.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: r-drbd-local
provisioner: r-drbd.io
parameters:
  tier: nvme
  replicas: "1"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: r-drbd-replicated
provisioner: r-drbd.io
parameters:
  tier: nvme
  replicas: "2"
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: r-drbd
driver: r-drbd.io
deletionPolicy: Delete
