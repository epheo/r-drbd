                            "maxLength": 253,
                            "minLength": 1,
                            "type": "string"
                          },
                          "snapshotUid": {
                            "description": "The Snapshot's uid, read live at CreateVolume. A Snapshot of that\nname with another uid, or a source without one, restores nothing.",
                            "maxLength": 36,
                            "nullable": true,
                            "type": "string"
                          }
                        },
                        "required": [
                          "snapshot"
                        ],
                        "type": "object"
                      },
                      "tier": {
                        "maxLength": 63,
                        "minLength": 1,
                        "type": "string",
                        "x-kubernetes-validations": [
                          {
                            "message": "tier is immutable",
                            "rule": "self == oldSelf"
                          }
                        ]
                      }
                    },
                    "required": [
                      "sizeBytes",
                      "tier"
                    ],
                    "type": "object",
                    "x-kubernetes-validations": [
                      {
                        "message": "assignment cannot be removed",
                        "rule": "!has(oldSelf.assignment) || has(self.assignment)"
                      },
                      {
                        "message": "ReadWriteMany needs replicas >= 2",
