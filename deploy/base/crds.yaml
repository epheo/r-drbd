                        "type": "object",
                        "x-kubernetes-validations": [
                          {
                            "message": "minor is immutable",
                            "rule": "has(self.minor) == has(oldSelf.minor) && (!has(self.minor) || self.minor == oldSelf.minor)"
                          },
                          {
                            "message": "secret is immutable",
                            "rule": "has(self.secret) == has(oldSelf.secret) && (!has(self.secret) || self.secret == oldSelf.secret)"
                          },
                          {
                            "message": "initialUpToDateNode is immutable",
