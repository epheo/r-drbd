                "jsonPath": ".status.conditions[?(@.type==\"Available\")].status",
                "name": "Available",
                "type": "string"
              },
              {
                "jsonPath": ".metadata.creationTimestamp",
                "name": "Age",
                "type": "date"
              }
            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for PoolSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "description": "Location fields are immutable: a pool is a fixed place on a fixed node.\nThe capacity policy may change at any time; it only gates new placements.",
                    "properties": {
                      "chunkSize": {
                        "description": "Thin pool chunk size, devices mode only, fixed at creation.\nAbsent: 64Ki, set by the agent.",
                        "nullable": true,
                        "x-kubernetes-int-or-string": true,
                        "x-kubernetes-validations": [
                          {
                            "message": "chunkSize must be a power of two from 64Ki to 1Gi",
                            "rule": "isQuantity(string(self)) && quantity(string(self)).isInteger() && quantity(string(self)).asInteger() in [65536, 131072, 262144, 524288, 1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728, 268435456, 536870912, 1073741824]"
                          }
                        ]
                      },
                      "devices": {
                        "description": "Blank whole disks the agent builds `vg` and `thinPool` from.\nAbsent: `vg` and `thinPool` already exist on the node.\nby-id paths only: kernel names like sdb change between boots.",
                        "items": {
                          "maxLength": 300,
                          "pattern": "^/dev/disk/by-id/[^/]+$",
                          "type": "string"
                        },
                        "maxItems": 64,
                        "minItems": 1,
                        "nullable": true,
                        "type": "array",
                        "x-kubernetes-list-type": "set"
                      },
                      "node": {
                        "maxLength": 253,
                        "minLength": 1,
                        "type": "string",
                        "x-kubernetes-validations": [
                          {
                            "message": "node is immutable",
                            "rule": "self == oldSelf"
                          }
                        ]
                      },
                      "overcommitPercent": {
                        "default": 100,
                        "description": "Committed volume sizes may reach this percent of the pool size less\nthe reserve. 100 never promises more than the pool holds.",
                        "format": "uint32",
                        "maximum": 1000.0,
                        "minimum": 100.0,
                        "type": "integer"
                      },
                      "reclaimPolicy": {
                        "description": "What deleting the Pool does to the VG, devices mode only.\nAbsent: Retain.",
                        "enum": [
                          "Retain",
                          "Delete"
                        ],
                        "nullable": true,
                        "type": "string"
                      },
                      "reservePercent": {
                        "default": 5,
                        "description": "Percent of the pool size that placement never plans to use.",
                        "format": "uint32",
                        "maximum": 50.0,
                        "minimum": 0.0,
                        "type": "integer"
                      },
                      "thinPool": {
                        "maxLength": 127,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9+_.][A-Za-z0-9+_.-]{0,126}$",
                        "type": "string",
                        "x-kubernetes-validations": [
                          {
                            "message": "thinPool is immutable",
                            "rule": "self == oldSelf"
                          },
                          {
                            "message": "thinPool is not a name",
                            "rule": "self != '.' && self != '..'"
                          }
                        ]
                      },
                      "tier": {
                        "maxLength": 253,
                        "minLength": 1,
                        "type": "string",
                        "x-kubernetes-validations": [
                          {
                            "message": "tier is immutable",
                            "rule": "self == oldSelf"
                          }
                        ]
                      },
                      "vg": {
                        "description": "LVM names only (keys::LVM_NAME_PATTERN): anything else would reach\nlvm commands as an option or a path.",
                        "maxLength": 127,
                        "minLength": 1,
                        "pattern": "^[A-Za-z0-9+_.][A-Za-z0-9+_.-]{0,126}$",
                        "type": "string",
                        "x-kubernetes-validations": [
                          {
                            "message": "vg is immutable",
                            "rule": "self == oldSelf"
                          },
                          {
                            "message": "vg is not a name",
                            "rule": "self != '.' && self != '..'"
                          }
                        ]
                      }
                    },
                    "required": [
                      "node",
                      "thinPool",
                      "tier",
                      "vg"
                    ],
                    "type": "object",
                    "x-kubernetes-validations": [
                      {
                        "message": "devices mode is fixed at creation",
                        "rule": "has(self.devices) == has(oldSelf.devices)"
                      },
                      {
                        "message": "devices is append only: removing a disk is not supported",
                        "rule": "!has(self.devices) || !has(oldSelf.devices) || oldSelf.devices.all(d, d in self.devices)"
                      },
                      {
                        "message": "chunkSize needs devices",
                        "rule": "!has(self.chunkSize) || has(self.devices)"
                      },
                      {
                        "message": "reclaimPolicy needs devices",
                        "rule": "!has(self.reclaimPolicy) || has(self.devices)"
                      },
                      {
                        "message": "chunkSize is immutable",
                        "rule": "has(self.chunkSize) == has(oldSelf.chunkSize) && (!has(self.chunkSize) || string(self.chunkSize) == string(oldSelf.chunkSize))"
                      }
                    ]
                  },
                  "status": {
                    "description": "Capacity, Available, Released and devices come from the agent; `volumes`, `committedBytes`\nand `placeableBytes` from the controller.",
                    "nullable": true,
                    "properties": {
                      "chunkBytes": {
                        "description": "Thin pool chunk size; feeds rs-discard-granularity.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "committedBytes": {
                        "description": "Sum of the sizes of the Volumes with a diskful replica here.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "conditions": {
                        "default": [],
                        "items": {
                          "description": "Condition contains details for one aspect of the current state of this API Resource.",
                          "properties": {
                            "lastTransitionTime": {
                              "description": "lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.",
                              "format": "date-time",
                              "type": "string"
                            },
                            "message": {
                              "description": "message is a human readable message indicating details about the transition. This may be an empty string.",
                              "type": "string"
                            },
                            "observedGeneration": {
                              "description": "observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.",
                              "format": "int64",
                              "type": "integer"
                            },
                            "reason": {
                              "description": "reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.",
                              "type": "string"
                            },
                            "status": {
                              "description": "status of the condition, one of True, False, Unknown.",
                              "type": "string"
                            },
                            "type": {
                              "description": "type of condition in CamelCase or in foo.example.com/CamelCase.",
                              "type": "string"
                            }
                          },
                          "required": [
                            "lastTransitionTime",
                            "message",
                            "reason",
                            "status",
                            "type"
                          ],
                          "type": "object"
                        },
                        "type": "array",
                        "x-kubernetes-list-map-keys": [
                          "type"
                        ],
                        "x-kubernetes-list-type": "map"
                      },
                      "devices": {
                        "description": "One row per `spec.devices` path, from the agent.",
                        "items": {
                          "properties": {
                            "message": {
                              "nullable": true,
                              "type": "string"
                            },
                            "model": {
                              "nullable": true,
                              "type": "string"
                            },
                            "path": {
                              "type": "string"
                            },
                            "serial": {
                              "nullable": true,
                              "type": "string"
                            },
                            "sizeBytes": {
                              "format": "uint64",
                              "minimum": 0.0,
                              "nullable": true,
                              "type": "integer"
                            },
                            "state": {
                              "description": "What the agent found on one listed device.",
                              "enum": [
                                "Missing",
                                "NotADisk",
                                "Member",
                                "Busy",
                                "NotEmpty",
                                "Blank"
                              ],
                              "type": "string"
                            }
                          },
                          "required": [
                            "path",
                            "state"
                          ],
                          "type": "object"
                        },
                        "type": "array",
                        "x-kubernetes-list-map-keys": [
                          "path"
                        ],
                        "x-kubernetes-list-type": "map"
                      },
                      "freeBytes": {
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "observedGeneration": {
                        "format": "int64",
                        "nullable": true,
                        "type": "integer"
                      },
                      "placeableBytes": {
                        "description": "Largest new volume placement accepts here now.",
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "totalBytes": {
                        "format": "uint64",
                        "minimum": 0.0,
                        "nullable": true,
                        "type": "integer"
                      },
                      "volumes": {
                        "default": [],
                        "description": "Names of Volumes with a diskful replica here; the finalizer waits on it.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array",
                        "x-kubernetes-list-type": "set"
                      }
                    },
                    "type": "object"
                  }
                },
                "required": [
                  "spec"
                ],
                "title": "Pool",
                "type": "object"
              }
            },
            "served": true,
            "storage": true,
            "subresources": {
              "status": {}
            }
          }
        ]
      }
