            ],
            "name": "v1alpha1",
            "schema": {
              "openAPIV3Schema": {
                "description": "Auto-generated derived type for VolumeSpec via `CustomResource`",
                "properties": {
                  "spec": {
                    "properties": {
                      "accessMode": {
                        "default": "ReadWriteOnce",
                        "description": "ReadWriteMany lets more than one node open the device at once (two\nDRBD Primaries, block mode only, replicas 2 or 3); the default allows\none attachment at a time.",
                        "enum": [
                          "ReadWriteOnce",
                          "ReadWriteMany"
                        ],
                        "type": "string",
                        "x-kubernetes-validations": [
                          {
                            "message": "accessMode is immutable",
                            "rule": "self == oldSelf"
                          }
                        ]
                      },
                      "assignment": {
                        "description": "Written once by the controller; only diskless entries come and go\nwith attachments.",
                        "nullable": true,
                        "properties": {
                          "initialUpToDateNode": {
                            "description": "The node that makes the first data current: it starts the volume\nwithout a sync, or, for a restore, is the sync source.",
                            "maxLength": 253,
                            "nullable": true,
                            "type": "string"
                          },
                          "minor": {
                            "description": "DRBD minor, cluster wide unique, same on every node; absent for replicas 1.",
                            "format": "uint32",
                            "minimum": 0.0,
                            "nullable": true,
                            "type": "integer"
                          },
                          "replicas": {
                            "items": {
                              "description": "Old and new entries correlate by node through the list map. A\ntiebreaker or diskless entry may become diskful (an evict move); a\ndiskful one never changes.",
                              "properties": {
                                "node": {
                                  "maxLength": 253,
                                  "minLength": 1,
                                  "type": "string"
                                },
                                "nodeId": {
                                  "description": "DRBD node id, 0 to 31, unique within the volume.",
                                  "format": "uint8",
                                  "maximum": 31.0,
                                  "minimum": 0.0,
                                  "type": "integer"
                                },
                                "pool": {
                                  "description": "Pool holding the LV; absent for diskless and tiebreaker.",
                                  "maxLength": 253,
                                  "nullable": true,
                                  "type": "string"
                                },
                                "port": {
                                  "description": "DRBD listen port on this node; absent for replicas 1.",
                                  "format": "uint16",
                                  "maximum": 65535.0,
                                  "minimum": 0.0,
                                  "nullable": true,
                                  "type": "integer"
                                },
                                "role": {
                                  "enum": [
                                    "diskful",
                                    "diskless",
                                    "tiebreaker"
                                  ],
                                  "type": "string"
                                }
                              },
                              "required": [
                                "node",
                                "nodeId",
                                "role"
                              ],
                              "type": "object",
                              "x-kubernetes-validations": [
                                {
                                  "message": "nodeId is immutable",
                                  "rule": "self.nodeId == oldSelf.nodeId"
                                },
                                {
                                  "message": "port is immutable",
                                  "rule": "has(self.port) == has(oldSelf.port) && (!has(self.port) || self.port == oldSelf.port)"
                                },
                                {
                                  "message": "a diskful replica keeps its role and pool",
                                  "rule": "oldSelf.role != 'diskful' || (self.role == 'diskful' && has(self.pool) == has(oldSelf.pool) && (!has(self.pool) || self.pool == oldSelf.pool))"
                                }
                              ]
                            },
                            "maxItems": 32,
                            "type": "array",
                            "x-kubernetes-list-map-keys": [
                              "node"
                            ],
                            "x-kubernetes-list-type": "map",
                            "x-kubernetes-validations": [
                              {
                                "message": "nodeId must be unique",
                                "rule": "self.all(x, self.exists_one(y, y.nodeId == x.nodeId))"
                              }
                            ]
                          },
                          "secret": {
                            "description": "Shared secret, 32 random bytes in Base64; absent for replicas 1.",
                            "maxLength": 64,
                            "nullable": true,
                            "type": "string"
                          }
                        },
                        "required": [
                          "replicas"
