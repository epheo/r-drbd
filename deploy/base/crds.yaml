                          }
                        ]
                      },
                      "attachments": {
                        "default": [],
                        "description": "Nodes that must see the device (ControllerPublish). A node without a\nreplica gets a diskless one appended to the assignment.",
                        "items": {
                          "type": "string"
                        },
                        "type": "array",
                        "x-kubernetes-list-type": "set"
                      },
                      "evict": {
                        "default": [],
                        "description": "Nodes whose replica must be placed elsewhere (a dead or retired\nnode). The controller makes one move per pass, for the first node\nby name that can act. Every move needs no resolve pending, no split\nbrain, no Snapshot in Suspending or Taking, and the\nreplica neither attached nor in use, unless the node's Node object is\ngone. A diskful move also needs replicas above 1, status.initializedAt\nset unless the node is not the initial one, another UpToDate replica\nwith quorum from a fresh agent, every other reachable diskful replica\nUpToDate, and no pin to the evicted node. A node listed here never receives a\ndiskless entry either. A node leaves the list once it holds no entry\nand no attachment. The replaced node keeps its LV as an orphan.",
                        "items": {
                          "maxLength": 253,
                          "type": "string"
                        },
                        "maxItems": 32,
                        "type": "array",
                        "x-kubernetes-list-type": "set"
                      },
                      "node": {
                        "maxLength": 253,
                        "nullable": true,
                        "type": "string"
                      },
                      "pool": {
                        "description": "Placement pins, read at placement and by every evict move. pool\nholds every diskful replica, node one of them.",
                        "maxLength": 253,
                        "nullable": true,
                        "type": "string"
                      },
                      "replicas": {
                        "default": 1,
                        "description": "1 is a plain LV with no DRBD; 2 or 3 are DRBD with quorum and, for 2, a tiebreaker.",
                        "format": "uint32",
                        "maximum": 3.0,
                        "minimum": 1.0,
                        "type": "integer",
                        "x-kubernetes-validations": [
                          {
                            "message": "replicas is immutable",
                            "rule": "self == oldSelf"
                          }
                        ]
                      },
                      "resolve": {
                        "description": "Split-brain resolution: every diskful replica except the\nsurvivor is discarded and resynced from it.",
                        "nullable": true,
                        "properties": {
                          "survivor": {
                            "description": "Node whose data wins.",
                            "maxLength": 253,
                            "minLength": 1,
                            "type": "string"
                          }
                        },
                        "required": [
                          "survivor"
                        ],
                        "type": "object"
                      },
                      "sizeBytes": {
                        "description": "Usable size as the CSI caller sees it; the LV is larger by the DRBD metadata.",
                        "format": "uint64",
                        "minimum": 1.0,
                        "type": "integer",
                        "x-kubernetes-validations": [
                          {
                            "message": "sizeBytes cannot shrink",
                            "rule": "self >= oldSelf"
                          }
                        ]
                      },
                      "source": {
