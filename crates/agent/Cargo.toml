[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "r-drbd node agent: thin LVM, DRBD, status reporting, CSI node plugin"

[dependencies]
async-trait = "0.1.92"
csi = { path = "../csi" }
drbd-config = { path = "../drbd-config" }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", default-features = false, features = ["client", "runtime", "rustls-tls", "ring"] }
lvm = { path = "../lvm" }
model = { path = "../model" }
rustix = { version = "1.1.5", default-features = false, features = ["std", "fs", "process", "net", "event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync", "fs"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["test-util"] }

[lints]
workspace = true
