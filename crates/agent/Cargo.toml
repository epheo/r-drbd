[package]
name = "agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "r-drbd node agent: thin LVM, DRBD, status reporting, CSI node plugin"

[dependencies]
async-trait = "0.1.92"
csi.workspace = true
drbd-config.workspace = true
futures.workspace = true
# Already in the tree through kube: the watch sockets need keepalive,
# which kube::Config cannot set.
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
lvm.workspace = true
model.workspace = true
# Already in the tree through rustls: the holder digests use its sha256.
ring = "0.17.14"
rustix = { workspace = true, features = ["fs", "process", "net", "event"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync", "fs"] }
tokio-stream.workspace = true
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
