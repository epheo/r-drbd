[package]
name = "controller"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "r-drbd controller: reconcilers, allocation, CSI controller plugin"

[dependencies]
base64 = "0.22.1"
csi.workspace = true
futures.workspace = true
getrandom = "0.3.4"
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring", "jsonpatch"] }
lvm.workspace = true
model.workspace = true
placer.workspace = true
prost-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
agent.workspace = true
# test-util: paused clock for the Lease deadline test.
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.27.0"
tracing-subscriber.workspace = true

[lints]
workspace = true
