[package]
name = "r-drbd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "r-drbd: controller and agent roles for the r-drbd.io storage plane"

[dependencies]
agent = { path = "../agent" }
clap = { version = "4.6.7", features = ["derive", "env"] }
controller = { path = "../controller" }
model = { path = "../model" }
rustix = { version = "1.1.5", default-features = false, features = ["std", "thread", "process", "system"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
