[package]
name = "r-drbd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "r-drbd: controller and agent roles for the r-drbd.io storage plane"

[dependencies]
agent.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
controller.workspace = true
model.workspace = true
rustix = { workspace = true, features = ["thread", "process", "system"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tracing-subscriber = { workspace = true, features = ["ansi"] }

[lints]
workspace = true
