[package]
name = "r-drbd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "r-drbd: controller and agent roles for the r-drbd.io storage plane"

[dependencies]
agent = { path = "../agent" }
clap = { version = "4.6.7", features = ["derive", "env"] }
controller = { path = "../controller" }
kube = { version = "4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
model = { path = "../model" }
rustix = { version = "1.1.3", default-features = false, features = ["std", "thread", "process", "system"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[lints]
workspace = true
